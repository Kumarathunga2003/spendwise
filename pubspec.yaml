name: spendwise
description: SpendWise personal expense, budget, and income tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.5
  path: ^1.9.1
  cryptography: ^2.9.0
  file_picker: ^13.3.2
  material_ui: ^1.11.0
  flutter_secure_storage: 11.2.0
  sqflite_sqlcipher: 3.4.1
  flutter_local_notifications: 22.3.3
  flutter_timezone: 5.1.1
  timezone: 0.11.0
  cryptography_flutter: 2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  assets:
    - assets/branding/
  uses-material-design: true
